<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Browser RPG</title>
<style>
/* HUD STYLE NOTE. One family: iron panels, parchment ink, one muted gold accent. Saturation is rationed so a status that matters can
   still shout: red is hurt, gold is what you want, arcane blue is the quest, ember is a threat, green is health and "good".
   A new panel takes its look from the tokens and shared classes below and writes no hex, px size or shadow of its own.
     TOKENS  surface --iron (panel) --iron-lift (rows, cells) --iron-hover --iron-sunk (bar wells) --iron-veil (tips, menus) --iron-glass (over the world)
             edge    --edge (resting) --edge-dim (quiet inner lines) --edge-hi (floating, hovered, focused)
             ink     --ink --ink-dim --ink-bright     accent --gold --gold-hi --gold-dim --gold-wash     state --bad --blood --moss --arcane --ember --violet --heal
             type    --fs-xs 9 (micro) --fs-sm 11 (meta, hints) --fs-md 13 (body) --fs-lg 15 (names, titles) --fs-xl 18 --fs-2xl 22 --fs-3xl 30 --fs-4xl 42 --fs-5xl 56 (banners)
             space   --sp-1..6 = 2 4 6 8 12 16, --gutter = the margin to the window edge     shape --r (3px) --r-sm (2px)     depth --lift-1 (small) --lift-2 (panel)
             layout  --rail-w (the left column: quest tracker over message log)  --frame-bottom, --fw (the unit frames)  --stack (what the dock leaves clear below it: the frames, their buffs and the bars under them)
     LAYOUT  Five boxes, each owning a rectangle, so nothing is placed by a guess about what else is on screen (HOM-108; bench/hud-layout.mjs holds it at six window sizes):
             .rail     left column, top to just above the swing bar: .tracker, then .msglog, as flex items of one box. The log takes what the tracker leaves and scrolls in it.
             .dock     the open middle: from the rail to the minimap, from the top gutter to --stack above the frames. Every .panel but the help is a flex item of it, so a panel is bounded
                       by it and two panels cannot overlap. Where they do not all fit across, dock.ts docks the HUD (.hud.docked: the rail steps aside) and then shuts the oldest.
             .frame    the unit frames, above the action bar. The target's wears the enemy's face left of its bars, so it is wider than the player's, which is centred on the
                       screen, or pushed right of the rail where the window is too narrow for both. Buffs and the
                       food wait hang above the frame, inside the --stack gap.
             .actionbar, .minimap, .menubar, .xp, .swing  fixed to their edges.
     CLASSES .panel     a window: iron chrome, a child of the dock, bounded by it, scrolls inside itself, its .ptitle row stays put. --chrome-edge tints its border (station, vendor).
             .ptitle    the title row; titleRow() in dom.ts builds it with its .pclose.     .rgroup  a small caps group heading inside a panel
             .recipe    a list row (forge, shop, flights, spell book): .rhead (.rname + .rreq), .rstat lines, .rbtns.  .locked dims it; .bad marks what you lack
                        .rthumb  an item's picture in such a row: in the head's .rlead beside the name, or .sm on a .rin material chip
             .btn       every button. + .pri (the action you came for: Make, Buy, Learn)  + .sm  + .block (full width, left)  + .off (cannot be used now)
             .chrome    iron chrome for a fixed surface (unit frame, tracker).  .pop  the same for a floating layer (tooltip, context menu, help)
             .bar       a gauge: set --bar-h and --fill (a token below); .fill moves, .label sits on it; .thin is the slim world-space gauge
             .art       generated art worn as an element's face (an item's thumbnail on a slot, an NPC's or the target enemy's portrait in a .face); .facerow is a portrait beside its .facebody
     The legacy hook names (.rbtn .mbtn .psort .dopt) stay on the markup for the benches; they carry no style of their own.
     Game-meaning colours stay literal where they carry meaning: the bar fills (--fill-*), floater and log colours, banner and hurt glows, tier colours (from the sim). */
:root{
  --iron:rgba(15,16,19,.86);--iron-solid:#0f1013;--iron-lift:rgba(36,38,43,.92);--iron-hover:#34312a;--iron-sunk:#08090b;--iron-veil:rgba(8,8,10,.96);--iron-glass:rgba(10,11,14,.6);
  --edge:#3b3d42;--edge-dim:#2e3034;--edge-hi:#6a6455;
  --ink:#d6cdb4;--ink-dim:#8d8672;--ink-bright:#ece6d2;
  --gold:#c0a55e;--gold-hi:#e8d9a0;--gold-dim:#6a5a22;--gold-wash:#3f351a;--gold-wash-hi:#54471f;
  --blood:#c23a32;--blood-dark:#6e1f1c;--bad:#e8523f;--moss:#93b58c;--arcane:#6ad8ff;--arcane-dim:#2f3b5a;--ember:#ff8a3a;--ember-dim:#5a3a22;--flare:#ff7a5a;
  --violet:#b39be0;--heal:#7fe8c8;--spark:#ffd06a;--crit:#ffd21f;--crit-glow:#b8801a;
  /* what a gauge is filled with: each is a whole background, so a bar can also take a flat colour (--fill:var(--blood)) */
  --fill-hp:linear-gradient(#6f8f56,#4a6a3a);--fill-energy:linear-gradient(#b08a3a,#7a5e24);--fill-blood:linear-gradient(#c23a32,#7e1f1c);
  --fill-xp:linear-gradient(#6b4aa0,#43306a);--fill-skill:linear-gradient(#5a7a96,#3a566e);--fill-cast:linear-gradient(#c0883a,#85591f);--fill-ride:linear-gradient(#a08a44,#6a5a22);
  --fill-fire:linear-gradient(#e0883a,#a04a14);--fill-steel:linear-gradient(#7d8794,#4c5662);--fill-gold:linear-gradient(#e8c460,#a8802a);--fill-gold-hi:linear-gradient(#f4dc8a,#d0a640);
  --fill-stamina:linear-gradient(#5e9aa0,#36666c);--fill-stamina-hi:linear-gradient(#7fc4ca,#46868e);
  --serif:Georgia,'Palatino Linotype',serif;
  --fs-xs:9px;--fs-sm:11px;--fs-md:13px;--fs-lg:15px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:30px;--fs-4xl:42px;--fs-5xl:56px;
  --sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:12px;--sp-6:16px;--gutter:12px;
  --r:3px;--r-sm:2px;
  --minimap-w:140px;--rail-w:clamp(250px,calc(50vw - 150px),300px);--rail-bottom:112px;
  --fw:200px;--ftotal:calc(var(--fw) + 2*var(--sp-3) + 2px);--frame-bottom:134px;--stack:246px; /* the frame is 71px tall; its buffs 36 above it; the dock ends --stack above the window's floor */
  --frame-l:max(calc(50% - var(--sp-4) - var(--ftotal)),calc(var(--gutter) + var(--rail-w) + var(--sp-5)));
  --dock-l:calc(var(--gutter) + var(--rail-w) + var(--sp-5));--dock-r:calc(var(--gutter) + var(--minimap-w) + var(--sp-4));
  --lift-1:inset 0 0 0 1px #000,0 2px 6px rgba(0,0,0,.6);--lift-2:inset 0 0 0 1px #000,0 4px 14px rgba(0,0,0,.7);
}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block}
body.swinging,body.swinging *{cursor:none!important} /* a camera drag takes the cursor away, over the HUD as well as the world */
.hud{position:fixed;inset:0;pointer-events:none;font:var(--fs-md)/1.25 var(--serif);color:var(--ink);user-select:none;text-shadow:0 1px 2px #000}

/* ---- shared shapes ---- */
.chrome,.panel,.pop{background:var(--iron);border:1px solid var(--chrome-edge,var(--edge));border-radius:var(--r);box-shadow:var(--lift-1);padding:var(--sp-4)}
.pop,.panel{box-shadow:var(--lift-2)}
.pop{background:var(--iron-veil);border-color:var(--edge-hi);padding:var(--sp-3) var(--sp-4)}
.scroll,.panel,.msglog{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--edge-hi) transparent}
.btn{display:inline-block;box-sizing:border-box;padding:var(--sp-2) var(--sp-5);background:var(--iron-lift);border:1px solid var(--edge);border-radius:var(--r);font-size:var(--fs-md);color:var(--ink);text-align:center;cursor:pointer}
.btn:hover{background:var(--iron-hover);border-color:var(--edge-hi);color:var(--gold)}
.btn:active{background:var(--iron-sunk)}
.btn.pri{background:var(--gold-wash);border-color:var(--gold-dim);color:var(--gold-hi)}
.btn.pri:hover{background:var(--gold-wash-hi);border-color:var(--gold);color:var(--ink-bright)}
.btn.sm{padding:var(--sp-1) var(--sp-4);font-size:var(--fs-sm)}
.btn.block{display:block;margin-top:var(--sp-2);padding:var(--sp-3) var(--sp-4);text-align:left}
.btn.off{opacity:.5;cursor:default;background:var(--iron-lift);border-color:var(--edge);color:var(--ink)}
.btn.off:active{background:var(--iron-lift)}
.btn.pri.off{background:var(--iron-lift);border-color:var(--edge);color:var(--ink)}
.bar{--bar-h:16px;--bar-fs:var(--fs-sm);position:relative;height:var(--bar-h);background:var(--iron-sunk);border:1px solid #000;box-shadow:0 0 0 1px var(--edge);border-radius:var(--r-sm);overflow:hidden;margin-top:var(--sp-2)}
.bar .fill{height:100%;width:100%;background:var(--fill,var(--fill-steel))}
.bar .label{position:absolute;inset:0;text-align:center;font-size:var(--bar-fs);line-height:var(--bar-h);color:var(--ink-bright)}
.bar.thin{--bar-h:5px;margin-top:var(--sp-1);border-radius:0}

/* ---- unit frames, minimap ---- */
/* the unit frames sit above the action bar, centred on it: you, then what you are hitting. Both are anchored (not laid out as a pair) so the player's frame
   does not slide when the target's comes and goes. Where the window is too narrow to centre them clear of the rail, both shift right together (--frame-l).
   A frame is name (and gold), health, then energy (the target's cast) = 71px, however much it is carrying: buffs and the food wait hang above it, in the --stack gap. */
@media (min-width:1400px){:root{--fw:230px}}
@media (max-width:1399px){.frame .name{font-size:var(--fs-md)}} /* the narrow frame is 200 wide: "Adventurer  Lv 28" and "Gold 4000" share its first line */
.frame{position:absolute;bottom:var(--frame-bottom);width:var(--fw);box-sizing:content-box;padding:var(--sp-3);display:grid;grid-template-columns:1fr auto;column-gap:var(--sp-3);align-items:baseline}
.frame>*{grid-column:1/-1}
.frame.player{left:var(--frame-l)}.frame.target{left:calc(var(--frame-l) + var(--ftotal) + var(--sp-6));display:none;--chrome-edge:var(--blood-dark)}
/* the target's face, left of its name and bars (HOM-144). The frame is widened by exactly the face and its gap, so the bars stay the
   player's length rather than being shortened by the picture; --tface is also the frame's height, which stops it jumping when a cast bar
   comes and goes under a name that is only two lines without one. */
.frame.target{--tface:56px;width:calc(var(--fw) + var(--tface) + var(--sp-5))}
.frame.target .facerow{gap:var(--sp-5);margin-bottom:0;align-items:center}
.frame.target .face{width:var(--tface);height:var(--tface)}
.frame .bar{--bar-h:16px;margin-top:var(--sp-2)}.frame .energy,.frame .stamina,.frame .enemycast{--bar-h:14px}
.minimap{position:absolute;top:var(--gutter);right:var(--gutter);width:140px;height:140px;border-radius:50%;background:var(--iron-solid);border:2px solid var(--edge);box-shadow:var(--lift-1);overflow:hidden}
.minimap canvas{display:block;width:140px;height:140px}
.mmzone{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:var(--fs-sm);color:var(--gold);letter-spacing:.04em}
.name{font-size:var(--fs-lg);font-weight:bold;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name.hard{color:var(--bad)}
.frame.player .name{grid-column:1}.frame .gold{grid-column:2;color:var(--gold);font-size:var(--fs-sm)}
.frame .status{position:absolute;right:0;bottom:calc(100% + var(--sp-2));color:var(--moss);font-size:var(--fs-sm);text-shadow:0 0 3px #000,0 1px 2px #000}
.hp{--fill:var(--fill-hp)}.energy{--fill:var(--fill-energy)}.enemyhp{--fill:var(--fill-blood)}
/* sprint's meter: lit while running flat out, grey while the breath comes back and sprint will not answer */
.stamina{--fill:var(--fill-stamina)}.stamina.running{--fill:var(--fill-stamina-hi)}.stamina.winded{--fill:var(--fill-steel);opacity:.65}
.xp{--bar-h:12px;position:absolute;left:12%;right:max(12%,350px);bottom:6px;margin-top:0;--fill:var(--fill-xp)}
.xp.skill{--fill:var(--fill-skill)} /* the bar is following a gathering/crafting skill, not combat */
/* buffs and debuffs under a unit frame: icon, seconds left, and a bar that empties over the effect's run */
.buffs{position:absolute;left:0;bottom:calc(100% + var(--sp-2));display:flex;gap:var(--sp-2)}.buffs:empty{display:none}
.buff{position:relative;width:28px;height:32px;background:var(--iron-lift);border:1px solid var(--edge);border-radius:var(--r);text-align:center;overflow:hidden}
.buff.bad{border-color:var(--blood-dark)}
.buff .bicon{font-size:var(--fs-lg);line-height:19px}.buff .bclock{font-size:var(--fs-xs);line-height:9px;color:var(--ink)}
.buff .bfill{position:absolute;left:0;bottom:0;height:3px;background:var(--moss)}.buff.bad .bfill{background:var(--blood)}
.buff.soon{animation:buffsoon 1s ease-in-out infinite}
@keyframes buffsoon{50%{border-color:var(--gold)}}
/* a proc window is not a thing you have, it is a thing to press: it burns, and so does the slot it opens */
.buff.proc{border-color:var(--ember)}.buff.proc .bfill{background:var(--ember)}

/* ---- action bar ---- */
/* a slot is 68px (64 and its border) unless the window is too narrow for the whole bar in one row, then it shrinks so the bar never wraps onto the frames above it.
   --slots is set by the HUD from the bar's length. The width is explicit, not shrink-to-fit (left:50% caps the space a shrunk box may take at half the viewport); the 1px is slack against rounding.
   The gap gives way before the slot does: at sixteen keys (HOM-138) the usual 8px gap leaves a 41px slot at 800 wide, under the 44px floor a click target wants. */
.actionbar{--slot-gap:var(--sp-4);--slot:min(68px,calc((100vw - 2*var(--gutter) - (var(--slots) - 1)*var(--slot-gap))/var(--slots)));position:absolute;left:50%;bottom:28px;width:calc(var(--slots)*var(--slot) + (var(--slots) - 1)*var(--slot-gap) + 1px);transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:var(--slot-gap);pointer-events:auto}
@media (max-width:1100px){.actionbar{--slot-gap:var(--sp-2)}} /* narrow enough that the slots have started to shrink: the gap goes first */
.slot{position:relative;box-sizing:border-box;width:var(--slot);height:var(--slot);background:var(--iron);border:2px solid var(--edge);box-shadow:var(--lift-1);border-radius:var(--r);overflow:hidden;text-align:center;cursor:grab}
.slot.empty{background:var(--iron-glass);border-style:dashed;border-color:var(--edge-dim);cursor:default}
/* what is printed on a slot follows the slot: the token sizes are the 68px slot's, and they give way proportionally as the bar shrinks to fit the window (HOM-104: 52px at 800 wide) */
/* the key is also the rebind button: click it and the slot takes the next key pressed, so it sits in the corner as a target big enough to hit */
.slot .icon{font-size:clamp(20px,calc(var(--slot)*.44),var(--fs-3xl));line-height:calc(var(--slot)*.68)}.slot .key{position:absolute;top:0;left:0;padding:var(--sp-1) 5px;font-weight:bold;font-size:clamp(11px,calc(var(--slot)*.19),var(--fs-md));color:var(--gold);cursor:pointer;border-bottom-right-radius:var(--r);min-width:11px}
.slot .key:hover{background:var(--gold-wash);color:var(--ink-bright)}
.slot .aname{position:absolute;bottom:var(--sp-1);width:100%;font-size:clamp(7px,calc(var(--slot)*.155),var(--fs-xs))} /* the longest name on the bar is Hemorrhage: it has to come down with the slot, or it prints past it */
/* a consumable slot: how many are left in the bag, and a flat look once there are none */
.slot .qty{position:absolute;top:var(--sp-1);right:5px;font-weight:bold;font-size:clamp(9px,calc(var(--slot)*.17),var(--fs-sm));color:var(--gold)}
.slot.gone .icon,.slot.gone .aname,.slot.gone .qty{opacity:.3}.slot.gone{border-color:var(--edge-dim)}
.slot.binding{border-color:var(--gold);animation:freshslot .8s ease-in-out infinite}.slot.binding .key{background:var(--gold-wash-hi);color:var(--ink-bright)}
/* the sweep, the clock and the padlock cover the whole slot, but they are things to read, not to press: the key under them stays clickable */
.slot .sweep{position:absolute;inset:0;pointer-events:none}.slot .cdtext{position:absolute;inset:0;font-size:clamp(15px,calc(var(--slot)*.32),var(--fs-2xl));font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:none}
.slot.locked .icon,.slot.locked .aname,.slot.locked .key{opacity:.28}.slot.locked{border-color:var(--edge-dim);box-shadow:inset 0 0 0 1px #000}
.slot .lock{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,8,.62);color:var(--gold);pointer-events:none}
.slot .lockicon{font-size:clamp(12px,calc(var(--slot)*.22),var(--fs-lg));line-height:calc(var(--slot)*.25)}.slot .locklvl{font-size:clamp(10px,calc(var(--slot)*.19),var(--fs-md));font-weight:bold;letter-spacing:.04em}
.slot.fresh{border-color:var(--gold);animation:freshslot .8s ease-in-out infinite}
@keyframes freshslot{50%{box-shadow:inset 0 0 14px 2px rgba(240,200,90,.8),0 0 16px 3px rgba(240,170,60,.9)}}
.slot.noenergy{border-color:var(--arcane-dim);filter:saturate(.3) brightness(.7)}.slot.outrange{border-color:var(--blood)}.slot.queued{border-color:var(--gold)}
/* a proc has opened this one: it comes last so it wins over the tints above, because it is the button to press right now */
.slot.proc{border-color:var(--ember);filter:none;animation:procslot .7s ease-in-out infinite}
@keyframes procslot{50%{box-shadow:inset 0 0 14px 2px var(--ember-dim),0 0 16px 3px var(--ember)}}

/* ---- banners, floaters, plates (the screen's loud voices: these keep their own colours) ---- */
.msg{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:var(--fs-2xl);font-weight:bold;color:var(--flare);opacity:0}
.msg.speech{top:34%;box-sizing:border-box;padding:0 max(14%,var(--gutter));font-size:var(--fs-xl);font-weight:normal;font-style:italic;color:var(--ink-bright);text-shadow:0 0 8px #000,0 1px 3px #000} /* a keeper talking is not an error: no flare. It holds for seconds, so it sits above the unit frames instead of over their bars. */
.banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:var(--fs-5xl);font-weight:bold;color:var(--gold);opacity:0;letter-spacing:.08em;text-shadow:0 0 18px #b8601a,0 3px 4px #000}
.banner.show{animation:lvl 2.4s ease-out}
.unlockbanner{top:36%;font-size:var(--fs-4xl);color:var(--gold-hi);text-shadow:0 0 20px #d08a1a,0 3px 4px #000}.unlockbanner.show{animation:lvl 3.4s ease-out}
.unlockbanner::after{content:attr(data-sub);display:block;font-size:var(--fs-xl);letter-spacing:.03em;font-weight:normal;color:var(--ink);margin-top:var(--sp-3)}
.warn{position:absolute;left:0;right:0;top:13%;box-sizing:border-box;padding:0 270px;text-align:center;font-size:var(--fs-3xl);font-weight:bold;letter-spacing:.06em;color:var(--flare);opacity:0;text-shadow:0 0 14px #a01010,0 2px 3px #000}
.warn.show{animation:warnfade 2s linear 1 forwards}
@keyframes warnfade{0%,85%{opacity:1}100%{opacity:0}}
.floater.interrupt{color:var(--spark);font-weight:bold}
.bar.enemycast{--bar-h:12px;--fill:var(--fill-fire);display:none}.bar.enemycast .fill{width:0}
.plate .pcast{--bar-h:4px;--fill:var(--ember);display:none;width:60px;box-shadow:0 0 0 1px var(--ember-dim);margin:var(--sp-1) auto 0}
@keyframes lvl{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.25)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.death{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:var(--fs-3xl);background:rgba(60,0,0,.55)}
.floater{position:absolute;left:0;top:0;font-weight:bold;font-size:var(--fs-2xl);white-space:nowrap;text-shadow:0 0 3px #000,0 2px 3px #000,0 0 8px #000}
.dmg-out{color:var(--ink-bright)}.dmg-crit{color:var(--crit);font-size:var(--fs-4xl);text-shadow:0 0 3px #000,0 2px 3px #000,0 0 10px #000,0 0 14px var(--crit-glow)}.dmg-dot{color:var(--violet);font-size:var(--fs-xl)}.dmg-in{color:var(--bad)}.heal{color:var(--heal)}.xpgain{color:var(--violet);font-size:var(--fs-xl)}
.plate{position:absolute;left:0;top:0;display:none;text-align:center;font-size:var(--fs-sm);white-space:nowrap;text-shadow:0 0 3px #000,0 1px 2px #000}
.plate .pbar{--fill:var(--blood);width:60px;margin:var(--sp-1) auto 0}
.plate.sel .pname{color:var(--bad);font-weight:bold}
.floater.loot{color:var(--moss);font-size:var(--fs-xl)}.floater.dropname{color:var(--gold-hi);font-size:var(--fs-md)}
.nodeplate .psub{font-size:var(--fs-sm);color:var(--moss)}

/* ---- panels ---- */
/* Every panel is a flex item of the dock (see LAYOUT above): the dock bounds its height, so it scrolls inside itself, and its width is the one thing a panel sets.
   Its title stays put while the body scrolls. The help is the exception: a veil over everything, placed by its own rule. */
.dock{position:absolute;left:var(--dock-l);right:var(--dock-r);top:var(--gutter);bottom:var(--stack);display:flex;justify-content:flex-end;align-items:flex-start;gap:var(--sp-5);pointer-events:none}
.hud.docked{--dock-l:var(--gutter)}
.panel{--pad:var(--sp-4);position:absolute;padding:var(--pad);pointer-events:auto;text-shadow:none}
.dock>.panel{position:relative;box-sizing:border-box;flex:none;max-width:100%;max-height:100%}.dock.measure>.panel{max-width:none}
.ptitle{display:flow-root;font-size:var(--fs-lg);font-weight:bold;margin-bottom:var(--sp-3);color:var(--gold);letter-spacing:.05em}
.panel>.ptitle{position:sticky;top:calc(-1*var(--pad));z-index:1;margin:calc(-1*var(--pad)) calc(-1*var(--pad)) var(--sp-3);padding:var(--pad) var(--pad) var(--sp-2);background:var(--iron-solid);border-bottom:1px solid var(--edge-dim)}
.pclose{float:right;cursor:pointer;color:var(--ink-dim);font-weight:normal}.pclose:hover{color:var(--gold)}
.psort{float:right;margin-top:-1px;font-weight:normal;letter-spacing:0}
.tpoints{float:right;font-size:var(--fs-md);font-weight:normal;color:var(--ink-dim);letter-spacing:0}.tpoints.ready{color:var(--gold)}
.dhint{float:right;font-size:var(--fs-sm);font-weight:normal;color:var(--ink-dim)}
.rgroup{margin:var(--sp-4) 0 var(--sp-2);padding-bottom:var(--sp-1);border-bottom:1px solid var(--edge);font-size:var(--fs-sm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}.rgroup:first-child{margin-top:0}
/* left to right in the dock: what a station or a shop opens (order 0), the lists that are read (skills, talents), then the sheet and the bag nearest the minimap */
.invpanel{order:9;width:268px}.charpanel{order:8;width:276px}
.invgold{color:var(--gold);margin:-3px 0 var(--sp-3)}
.grid{display:grid;grid-template-columns:repeat(4,60px);gap:var(--sp-2)}
.cell{position:relative;width:60px;height:60px;box-sizing:border-box;background:var(--iron-lift);border:2px solid var(--edge-dim);border-radius:var(--r);text-align:center;overflow:hidden;cursor:pointer}
.cell:hover{filter:brightness(1.3)}
.cell .icon{font-size:var(--fs-2xl);line-height:36px}.cell .icon.ghost{opacity:.25;color:var(--ink)}
.cell .iname{position:absolute;bottom:1px;left:0;right:0;font-size:var(--fs-xs);line-height:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .qty{position:absolute;top:1px;left:3px;font-size:var(--fs-sm);font-weight:bold;color:var(--gold)}
.equip{display:grid;grid-template-columns:repeat(4,60px);gap:var(--sp-3);justify-content:center;margin-bottom:var(--sp-4)} /* seven slots, two rows of four: still two rows, so the stats under it stay in reach at 800x560 */
.eqcell .eqlabel{position:absolute;top:1px;left:0;right:0;font-size:var(--fs-xs);opacity:.7}.eqcell .icon{line-height:56px}
@media (max-height:760px){.charpanel{width:322px}.equip{grid-template-columns:repeat(7,40px);gap:var(--sp-2)}.equip .cell{width:40px;height:40px}.equip .eqcell .icon{font-size:var(--fs-xl);line-height:44px}} /* a short window: the seven slots in one row, so the stats stay in reach */
.srow{display:flex;justify-content:space-between;margin-top:var(--sp-2)}.sv{color:var(--gold)}
.tip{position:fixed;display:none;z-index:10;max-width:220px;pointer-events:none}
.tname{font-weight:bold;font-size:var(--fs-lg)}.tslot{opacity:.6;font-size:var(--fs-sm)}.tstat{color:var(--moss);margin-top:var(--sp-1)}.tdesc{opacity:.7;margin-top:var(--sp-2);font-style:italic}.tcmp{margin-top:var(--sp-2)}.tcmp.bad{color:var(--bad)}.tcmp.good{color:var(--moss)}.thint{margin-top:var(--sp-2);opacity:.5;font-size:var(--fs-sm)}
.tval{margin-top:var(--sp-2);color:var(--gold);font-size:var(--fs-sm)}
.ctxmenu{position:fixed;display:none;z-index:11;padding:0;pointer-events:auto}
.mrow{padding:var(--sp-2) 14px;cursor:pointer}.mrow:hover{background:var(--iron-hover)}.mrow.bad{color:var(--bad)}
.mhead{padding:var(--sp-3) 14px;font-size:var(--fs-sm);color:var(--ink-dim);border-bottom:1px solid var(--edge)}
.skillspanel{order:5;width:220px}
@media (max-height:760px){.skillspanel{width:440px}.skillgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--sp-6)}} /* a short window: the list in two columns, not a scroll */
@media (max-height:640px){.skillspanel{width:620px}.skillgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.skillgrid .skillrow{margin-bottom:var(--sp-2)}} /* a shorter one: three (the dock is 628 wide at 800) */
.skillrow{margin-bottom:7px}.skillhead{display:flex;justify-content:space-between}.skilllvl{color:var(--gold);font-weight:bold}
.skillbar{--bar-h:12px;--fill:var(--fill-skill)}.skillbar.thin{--bar-h:5px}
.skilltotal{margin-bottom:var(--sp-4);padding-bottom:var(--sp-3);border-bottom:1px solid var(--edge-dim)}.skilltotal .skillname{font-weight:bold}.skilllvl.done{color:var(--moss)}
.skillnote{margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--ink-dim)}
.talentpanel{order:5;width:760px}
.ttrees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4)}
.ttree{background:var(--iron-glass);border:1px solid var(--edge-dim);border-radius:var(--r);padding:var(--sp-3)}
.tthead{display:flex;justify-content:space-between;font-weight:bold}.ttspent{color:var(--gold)}
.ttblurb{font-size:var(--fs-sm);opacity:.6;margin:var(--sp-1) 0 var(--sp-3);min-height:26px}
/* a tier is a row of two, the capstone a row of one; the mark between rows is what that tier costs to open */
.ttier{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin-bottom:5px}.ttier.cap{grid-template-columns:1fr}
.ttiermark{font-size:var(--fs-xs);text-align:center;color:var(--ink-dim);opacity:.55;letter-spacing:.06em;margin-bottom:var(--sp-1)}
.talent{position:relative;background:var(--iron-lift);border:2px solid var(--edge-dim);border-radius:var(--r);padding:var(--sp-2) var(--sp-3);cursor:pointer}
/* the node's picture, centred above its words. background-color, not the `background` shorthand: the shorthand
   would undo the size and position .art sets at the foot of this sheet (see the note down there) */
.tlicon{width:34px;height:34px;margin:0 auto var(--sp-1);border:1px solid var(--edge-dim);border-radius:var(--r);background-color:var(--iron-glass)}
.talent:hover{border-color:var(--edge-hi)}
.talent.taken{border-color:var(--gold)}
.talent.shut{opacity:.45;cursor:default}.talent.shut:hover{border-color:var(--edge-dim)}
.talent.taken.shut{opacity:.8}
.tlname{font-size:var(--fs-sm);font-weight:bold;padding-right:26px;min-height:26px}.tlrank{position:absolute;top:var(--sp-2);right:var(--sp-3);font-size:var(--fs-sm);color:var(--gold)}
@media (max-width:820px){.talent{padding:var(--sp-2)}.tlname{padding-right:0;min-height:0}.tlrank{position:static;margin-top:var(--sp-1)}} /* the panel is under 660 wide: a name and its rank no longer fit on one line */
.tlreq{font-size:var(--fs-xs);color:var(--ink-dim);opacity:.7}.tlreq.bad{color:var(--bad);opacity:1}
.treset{text-align:center;margin-top:var(--sp-4)}
.shoppanel{--chrome-edge:var(--gold-dim);width:290px}.shopgold{color:var(--gold);margin-bottom:var(--sp-1)}.shophint{font-size:var(--fs-sm);opacity:.6;margin-bottom:var(--sp-3)}
.forgepanel{--chrome-edge:var(--ember-dim);width:330px}
.bookpanel{width:300px}
.bookpanel .recipe[draggable="true"]{cursor:grab}
.recipe{background:var(--iron-lift);border:1px solid var(--edge-dim);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3)}.recipe.locked{opacity:.8}
.rhead{display:flex;justify-content:space-between;gap:var(--sp-3)}.rname{font-weight:bold}.rreq{color:var(--moss)}.rreq.bad,.rin.bad,.psub.bad{color:var(--bad)}
.rstat{color:var(--moss)}.rinputs{margin-top:var(--sp-2)}.rin{display:inline-block;margin-right:10px;color:var(--moss)}
.rmeta{font-size:var(--fs-sm);opacity:.6;margin-top:var(--sp-1)}.rbtns{margin-top:5px;display:flex;gap:var(--sp-3)}
.rhead.rwrap{flex-wrap:wrap}.rhead.rwrap>.rstat{flex-basis:100%} /* a head that carries a second line under its name and note */
/* an item's picture in a list row (itemThumb in art.ts): what a recipe makes, pictured beside its name in the .rlead at the left of the head, and
   .sm on the .rin chip of each material it eats. background-color, not the `background` shorthand, for the reason .tlicon gives above. */
.rlead{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.forgepanel .rhead{align-items:center} /* the level a station asks for, level with the name beside the picture rather than at the top of a taller head */
.rthumb{flex:none;width:34px;height:34px;border:1px solid var(--edge-dim);border-radius:var(--r);background-color:var(--iron-glass);text-align:center}
.rthumb .icon{font-size:var(--fs-xl);line-height:32px}
.rthumb.sm{display:inline-block;width:18px;height:18px;margin-right:var(--sp-2);vertical-align:-5px}
.rthumb.sm .icon{font-size:var(--fs-sm);line-height:16px}
/* .enchrow: a recipe row with its button beside the text, not under it (the rune circle lists a row per slot per enchant, so height is what it spends) */
.enchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--sp-4);align-items:center}.enchrow>*{grid-column:1}.enchrow>.rbtns{grid-column:2;grid-row:1/span 3;margin:0}
.enchrow .rinputs{margin-top:var(--sp-1);display:flex;flex-wrap:wrap;column-gap:var(--sp-4)}.enchrow .rin{margin-right:0}.enchrow .rinputs .rmeta{margin:0;align-self:center}

/* ---- the admin / QA panel (admin-ui.ts): a dev-build panel, so it takes the panel chrome and adds only the form rows the others have no use for ---- */
/* its button sits in the menu bar's row, in the corner opposite it: the bottom-left is clear of the action bar above and of the XP bar, which starts at 12% */
.devbar{position:absolute;left:var(--gutter);bottom:var(--sp-2);pointer-events:auto}
.adminpanel{order:1;width:300px}
.afield{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.afield input,.afield select{flex:1;min-width:0;box-sizing:border-box;padding:var(--sp-2) var(--sp-3);background:var(--iron-lift);border:1px solid var(--edge);border-radius:var(--r);font-family:var(--serif);font-size:var(--fs-md);color:var(--ink)}
.afield input[type=number]{flex:0 0 68px}
.anow{font-size:var(--fs-sm);color:var(--ink-dim);margin-bottom:var(--sp-2)}
.alist{max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--edge-hi) transparent}
.arow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--edge-dim)}
.arow:hover{background:var(--iron-lift)}
.aitem{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---- combat bars ---- */
.swing{--bar-h:10px;--bar-fs:var(--fs-xs);--fill:var(--fill-steel);position:absolute;left:50%;bottom:96px;width:424px;margin-left:-212px;margin-top:0;opacity:.55}.swing .fill{width:0}.swing .label{letter-spacing:.06em}
.swing.on{--fill:var(--fill-gold);opacity:1;box-shadow:0 0 0 1px var(--gold),0 0 8px rgba(240,190,80,.45)}.swing.on.ready{--fill:var(--fill-gold-hi)}
.castbar{--bar-h:18px;--fill:var(--fill-cast);position:absolute;left:50%;bottom:110px;width:240px;margin-left:-120px;margin-top:0;display:none}.castbar .fill{width:0}.castbar.ride{--fill:var(--fill-ride)}

/* ---- message log, quest tracker, dialogue ---- */
/* The rail is the left column, from the top gutter to above the swing bar (the log's lines are clickable, so a log over a slot would eat the click). It is as wide as the
   window allows (--rail-w: 250 at 800, 300 from 900), and the unit frames give way to it, not the other way round. The tracker is as tall as its lines, the log takes the
   rest, up to 150px, and scrolls in it: a keeper's four-line sentence is no longer squeezed into a 120px column (HOM-108). */
.rail{position:absolute;left:var(--gutter);top:var(--gutter);bottom:var(--rail-bottom);width:var(--rail-w);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;pointer-events:none}
.hud.docked .rail{display:none} /* the dock needs the room: dock.ts sets .docked only while an open window cannot fit beside the rail */
.msglog{order:1;flex:0 1 auto;min-height:0;box-sizing:border-box;width:100%;max-height:150px;pointer-events:auto;padding:var(--sp-2) var(--sp-3);background:var(--iron-glass);border-radius:var(--r)}
.msglog:empty{display:none}
.logline{margin-top:var(--sp-1);color:var(--ink)}.log-xp{color:var(--violet)}.log-loot{color:var(--moss)}.log-drop{color:var(--gold-hi)}.log-kill{color:var(--ink-dim)}.log-lvl{color:var(--gold);font-weight:bold}.log-quest{color:var(--arcane);font-weight:bold}.log-bad{color:var(--bad)}
.tracker{order:0;flex:none;box-sizing:border-box;width:min(100%,264px);padding:var(--sp-4) 10px;border-left:3px solid var(--arcane)}
.tracker.ready{border-left-color:var(--gold);animation:readypulse 1.4s ease-in-out infinite}
@keyframes readypulse{50%{box-shadow:inset 0 0 0 1px #000,0 0 12px #b8601a}}
.qtitle{font-weight:bold;color:var(--gold);margin-bottom:5px}.qline{margin-top:var(--sp-2)}.qline.done{color:var(--moss);opacity:.8}
.qnav{display:none;align-items:center;gap:var(--sp-4);margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px solid var(--edge);color:var(--arcane)}
.qarrow{display:inline-block;font-size:var(--fs-xl);color:var(--gold);transition:transform .1s}
/* A dialogue is a window in the dock like any other, but it sits on the dock's floor (just above the unit frames) and in the middle of what room it has. */
.panel.dialogue{width:538px;align-self:flex-end;margin-inline:auto}
.dline{margin-bottom:var(--sp-4);font-size:var(--fs-lg);line-height:1.4}
.dopt{color:var(--gold-hi)}.dopt.treset,.dopt.helpok{text-align:center}

/* ---- help overlay, menu bar ---- */
.helpoverlay{background:var(--iron-veil);max-height:calc(100vh - 2*var(--gutter) - 34px);left:50%;top:50%;transform:translate(-50%,-50%);width:560px;padding:var(--sp-6) 20px;border-color:var(--edge-hi);z-index:20}
.helptitle{font-size:var(--fs-2xl);font-weight:bold;color:var(--gold);margin-bottom:var(--sp-3);letter-spacing:.06em}.helpgoal{font-size:var(--fs-lg);margin-bottom:10px;line-height:1.4}
.helpgrid{display:grid;grid-template-columns:150px 1fr;gap:var(--sp-2) var(--sp-5)}.hkey{color:var(--gold);font-weight:bold}
.helpnote{margin-top:10px;opacity:.7}
.menubar{position:absolute;right:var(--gutter);bottom:var(--sp-2);display:flex;gap:var(--sp-3);pointer-events:auto}
.mbtn{padding:var(--sp-1) var(--sp-4);background:var(--iron)}
.hurt{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 120px 30px rgba(170,15,15,.7)}
.hurt.show{animation:hurt .45s ease-out}.hurt.heavy.show{animation:hurt 1.2s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
.questbanner{top:20%;color:var(--arcane);text-shadow:0 0 22px #1a8fc0,0 3px 4px #000}.questbanner.show{animation:lvl 3.2s ease-out}

/* ---- the world map screen and the flight ride (flight-ui.ts): the map scene is drawn in place of the game, so the game's own overlays step aside ---- */
.hud.mapmode .rail,.hud.mapmode .dock,.hud.mapmode .actionbar,.hud.mapmode .swing,.hud.mapmode .frame.target,.hud.mapmode .panel,.hud.mapmode .menubar,.hud.mapmode .devbar,.hud.mapmode .xp,.hud.mapmode .minimap{display:none!important}
.maplayer,.ridelayer{position:absolute;inset:0;pointer-events:none}
.maptitle,.ridetitle{position:absolute;left:0;right:0;text-align:center;font-size:var(--fs-3xl);color:var(--gold);text-shadow:0 0 14px #000,0 2px 3px #000}
.maptitle{top:22px;letter-spacing:.2em}.ridetitle{top:40px;letter-spacing:.12em}
.maphint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--ink-dim)}
.maptown{position:absolute;left:0;top:0;white-space:nowrap;font-size:var(--fs-xl);font-weight:bold;color:var(--spark);text-shadow:0 0 4px #000,0 2px 4px #000,0 0 10px #000}.maptown.lost{color:var(--ink-dim);font-weight:normal}.maptown.mapyou{color:var(--arcane);font-size:var(--fs-lg)}
.ridebar{--fill:var(--gold);position:absolute;top:86px;left:50%;width:280px;margin-left:-140px}.ridebar .ridefill{width:0}

/* ---- the generated art (HOM-135) ---- */
/* .art is a piece of art worn as an element's whole face: a slot (bag, equipment, action bar) wears its item's thumbnail, a .face wears an NPC's
   portrait. Art is square with the subject centred in it, so cover fits a square slot exactly and only trims a wider box. A label printed over
   art takes the panel's own veil behind it, so a name still reads against a light-painted subject.
   This block comes last on purpose: every surface that wears art (.cell, .slot) sets `background:` further up, and the shorthand would put the
   size and the position back to auto and 0 0 -- which paints the art at its own 192px, anchored to the slot's top-left corner. */
.art{background-size:cover;background-position:center}
.cell.art .iname,.cell.art .eqlabel,.slot.art .aname{background:var(--iron-veil)}
.facerow{display:flex;gap:var(--sp-5);margin-bottom:var(--sp-3)}
.facebody{flex:1;min-width:0}
.face{flex:none;width:64px;height:64px;border:1px solid var(--edge);border-radius:var(--r)} /* no portrait: the panel hides it and the column takes the width */
.dialogue .face{width:112px;height:112px} /* the one panel where you are looking at them, not at their stock */
</style>
