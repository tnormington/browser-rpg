<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Browser RPG</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block}
#help{position:fixed;left:8px;bottom:8px;color:#fff;font:12px sans-serif;opacity:.7;pointer-events:none}
.hud{position:fixed;inset:0;pointer-events:none;font:13px/1.2 sans-serif;color:#fff;user-select:none;text-shadow:0 1px 2px #000}
.frame{position:absolute;top:12px;width:230px;background:rgba(10,12,18,.7);border:1px solid #000;border-radius:4px;padding:6px}
.frame.player{left:12px}.frame.target{left:260px;display:none;border-color:#7a2020}
.name{font-weight:bold;margin-bottom:4px}.name.hard{color:#ff6b5a}
.bar{position:relative;height:16px;background:#222;border:1px solid #000;border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;width:100%}
.bar .label{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px}
.hp .fill{background:#3fae3f}.energy .fill{background:#d8b030}.enemyhp .fill{background:#c23a3a}
.xp{position:absolute;left:12%;right:12%;bottom:6px;height:12px}.xp .fill{background:#7a4ad0}.xp .label{line-height:12px;font-size:10px}
.actionbar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:8px}
.slot{position:relative;width:64px;height:64px;background:rgba(10,12,18,.8);border:2px solid #555;border-radius:6px;overflow:hidden;text-align:center}
.slot .icon{font-size:28px;line-height:46px}.slot .key{position:absolute;top:2px;left:5px;font-weight:bold;font-size:12px;color:#ffe14a}
.slot .aname{position:absolute;bottom:2px;width:100%;font-size:9px}
.slot .sweep{position:absolute;inset:0}.slot .cdtext{position:absolute;inset:0;font-size:20px;font-weight:bold;line-height:64px}
.slot.noenergy{border-color:#2a4aa0;filter:saturate(.3) brightness(.7)}.slot.outrange{border-color:#c02020}.slot.queued{border-color:#ffe14a}
.msg{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:20px;font-weight:bold;color:#ff8a6a;opacity:0}
.banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:56px;font-weight:bold;color:#ffe14a;opacity:0;text-shadow:0 0 18px #ff9a1a,0 3px 4px #000}
.banner.show{animation:lvl 2.4s ease-out}
@keyframes lvl{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.25)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.death{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28px;background:rgba(80,0,0,.45)}
.floater{position:absolute;left:0;top:0;font-weight:bold;font-size:22px;white-space:nowrap}
.dmg-out{color:#fff}.dmg-crit{color:#ffd24a;font-size:32px}.dmg-dot{color:#d070ff;font-size:18px}.dmg-in{color:#ff5050}.heal{color:#5aff7a}.xpgain{color:#b48aff;font-size:16px}
.plate{position:absolute;left:0;top:0;display:none;text-align:center;font-size:11px;white-space:nowrap}
.plate .pbar{width:60px;height:5px;background:#222;border:1px solid #000;margin:2px auto 0}.plate .fill{height:100%;background:#c23a3a}
.plate.sel .pname{color:#ff6b5a;font-weight:bold}
.floater.loot{color:#8affc0;font-size:18px}.floater.dropname{color:#ffe9a0;font-size:13px}
.feed{position:absolute;left:12px;bottom:60px;font-size:13px;color:#8affc0}.feedline{margin-top:2px}
.panel{position:absolute;top:90px;background:rgba(10,12,18,.88);border:1px solid #000;border-radius:4px;padding:8px;pointer-events:auto;text-shadow:none}
.invpanel{right:12px;width:268px}.charpanel{right:292px;width:210px}
.ptitle{font-weight:bold;margin-bottom:6px;color:#ffe14a}
.grid{display:grid;grid-template-columns:repeat(4,60px);gap:4px}
.cell{position:relative;width:60px;height:60px;box-sizing:border-box;background:rgba(40,44,56,.9);border:2px solid #444;border-radius:4px;text-align:center;overflow:hidden;cursor:pointer}
.cell .icon{font-size:24px;line-height:36px}.cell .icon.ghost{opacity:.25;color:#fff}
.cell .iname{position:absolute;bottom:1px;left:0;right:0;font-size:8px;line-height:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .qty{position:absolute;top:1px;left:3px;font-size:11px;font-weight:bold;color:#ffe14a}
.equip{display:grid;grid-template-columns:repeat(2,60px);gap:6px 10px;justify-content:center;margin-bottom:8px}
.eqcell .eqlabel{position:absolute;top:1px;left:0;right:0;font-size:8px;opacity:.7}.eqcell .icon{line-height:56px}
.srow{display:flex;justify-content:space-between;margin-top:3px;font-size:12px}.sv{color:#ffe14a}
.tip{position:fixed;display:none;z-index:10;max-width:220px;background:rgba(5,6,10,.95);border:1px solid #888;border-radius:4px;padding:6px 8px;font-size:12px;pointer-events:none}
.tname{font-weight:bold;font-size:14px}.tslot{opacity:.6;font-size:11px}.tstat{color:#6aff8a;margin-top:2px}.tdesc{opacity:.7;margin-top:4px;font-style:italic}.tcmp{margin-top:4px}.thint{margin-top:4px;opacity:.5;font-size:10px}
.ctxmenu{position:fixed;display:none;z-index:11;background:rgba(5,6,10,.95);border:1px solid #888;border-radius:4px;pointer-events:auto}
.mrow{padding:4px 14px;font-size:12px;cursor:pointer}.mrow:hover{background:#334}
.skillspanel{left:12px;top:150px;width:220px}
.skillrow{margin-bottom:7px}.skillhead{display:flex;justify-content:space-between;font-size:13px}.skilllvl{color:#ffe14a;font-weight:bold}
.skillbar{height:12px}.skillbar .fill{background:#4a8ad0}.skillbar .label{line-height:12px;font-size:9px}
.forgepanel{left:50%;top:90px;transform:translateX(-50%);width:330px}
.pclose{float:right;cursor:pointer;color:#fff;opacity:.6}.pclose:hover{opacity:1}
.recipe{background:rgba(40,44,56,.9);border:1px solid #555;border-radius:4px;padding:6px 8px;margin-bottom:6px}.recipe.locked{opacity:.8}
.rhead{display:flex;justify-content:space-between}.rname{font-weight:bold}.rreq{font-size:12px;color:#8affc0}.rreq.bad,.rin.bad,.psub.bad{color:#ff6b5a}
.rstat{color:#6aff8a;font-size:12px}.rinputs{margin-top:3px;font-size:12px}.rin{display:inline-block;margin-right:10px;color:#8affc0}
.rmeta{font-size:11px;opacity:.6;margin-top:2px}.rbtns{margin-top:5px;display:flex;gap:6px}
.rbtn{padding:3px 10px;background:#3b5d2a;border:1px solid #000;border-radius:3px;font-size:12px;cursor:pointer}.rbtn:hover{background:#4a7a35}.rbtn.off{background:#444;opacity:.6}
.castbar{position:absolute;left:50%;bottom:110px;width:240px;margin-left:-120px;display:none;height:18px}.castbar .fill{background:#d08a30;width:0}.castbar .label{line-height:18px}
.nodeplate .psub{font-size:10px;color:#8affc0}
</style>
</head>
<body>
<div id="help">WASD move · click ground to move · drag to orbit · wheel to zoom · I inventory · C character · K skills · click rocks, trees and the forge</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
